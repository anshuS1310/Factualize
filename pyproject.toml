[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factualize"
version = "0.1.0"
description = "Local-first evidence-backed PDF fact knowledge layer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "google-genai>=1,<2",
    "PyMuPDF>=1.24,<2",
    "pymupdf4llm>=0.0.17,<1",
    "docling>=2,<3",
    "onnxruntime>=1.18,<2",
    "sentence-transformers>=3,<4",
    "numpy>=1.26,<3",
    "rapidfuzz>=3,<4",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["backend*"]
